# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
path: /media/yanggang/847C02507C023D84/Potsdam640 # dataset root dir
train: train/image # train images (relative to 'path') 4 images
val: val/image # val images (relative to 'path') 4 images
test: test/image # test images (optional)
nc: 5

# Class Names
names:
  0: Impsurfaces
  1: Building
  2: vegetation
  3: Tree
  4: Car
  # 5: Background


#Colors:[r, g, b]
colors:
  0: [255, 255, 255]
  1: [0, 0, 255]
  2: [0, 255, 255]
  3: [0, 255, 0]
  4: [255, 255, 0]
  # 5: [255, 0, 0]


# Download script/URL (optional)
download: https://github.com/kuazhangxiaoai/ultralytics-semantic-segment/releases/download/datasets/Cityscapes-YOLO-512-small.zip
