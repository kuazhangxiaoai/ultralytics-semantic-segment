# Cityscapes-YOLO dataset by Ultralytics
# Documentation: https://docs.ultralytics.com/datasets/segment/CityEcapse-semseg/
# Example usage: yolo train data=CityscapesYOLO.yaml
# parent
# ├── ultralytics
# └── datasets
#     └── Cityscapes-YOLO  ← downloads here (1 MB)

# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
path: /media/yanggang/847C02507C023D84/LoveDAYOLO # dataset root dir
train: train/image # train images (relative to 'path') 4 images
val: val/image # val images (relative to 'path') 4 images
test: test/image # test images (optional)
nc: 6

# Class Names
names:
  0: Building
  1: Road
  2: Water
  3: Barren
  4: Forest
  5: Agricultural


#Colors:[r, g, b]
colors:
  0: [255, 0, 0]
  1: [255, 255, 0]
  2: [0, 0, 255]
  3: [159, 129, 156]
  4: [0, 255, 0]
  5: [255, 159, 128]


# Download script/URL (optional)
download: https://github.com/kuazhangxiaoai/ultralytics-semantic-segment/releases/download/datasets/Cityscapes-YOLO-512-small.zip
